<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <nav class="navbar">
      <div class="logo"><img src="assets/image.png" alt="Logo" /></div>
      <div class="location">
        <span >  Deliver to <br><i class="fa-solid fa-location-dot"></i> INDIA</span>
      </div>
        <div class="search">
                 <select class="dropdown">
                    <option value="all">All</option>
                    <option value="electronics">Electronics</option>
                    <option value="fashion">Fashion</option>
                    <option value="home">Home</option>
                    <option value="books">Books</option>
                </select>
                <input type="text" placeholder="Search..." class="search-input" />
                <button class="search-button"><i class="fa-solid fa-magnifying-glass" ></i>
                </button>
            </div>
      <div class="signin">
        <a href="#"><i class="fa-solid fa-user"></i> Sign In</a>
      </div>
      <div class="return">
        <a href="#"><i class="fa-brands fa-product-hunt"></i> Returns & Orders</a>
      </div>
      <div class="cart">
        <a href="#"><i class="fa-solid fa-shopping-cart"></i></a>
      </div>
      <div class="advertise"><img src="/assets/icon.webp" alt=""></div>
    </nav>
  </body>
</html>
